name = "sleek-btg-portfolio"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Public URL base for objects — served by this Worker at /media/*
[vars]
PUBLIC_BASE_URL = "https://sleek-btg-portfolio.sleek-btg-mv.workers.dev/media"

[[r2_buckets]]
binding = "PORTFOLIO_BUCKET"
bucket_name = "sleek-btg-portfolio"

# Set after deploy:
#   npx wrangler secret put FIREBASE_API_KEY
# Use the same web API key from js/firebase/config.js
